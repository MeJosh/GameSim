[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesim"
version = "0.0.1"
description = "A game-agnostic simulation and DRL framework for training and analyzing game-playing agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Josh Elliott" }]
dependencies = [
    "numpy>=1.26",
    "rich>=13.7",
]

[project.optional-dependencies]
# DRL stack — pulled in only when you start training (Phase 2).
rl = [
    "gymnasium>=0.29",
    "pettingzoo>=1.24",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",   # MaskablePPO (action masking)
    "torch>=2.2",
]
# Visualization — game-specific renderers (Phase 3).
viz = [
    "pygame>=2.5",
]
# Local play UI. This stays separate from the engine and RL extras so headless
# simulation/training installations do not need an HTTP stack.
web = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=4.6",
    "ruff>=0.15.14",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamesim = ["py.typed", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (e.g. training smoke tests)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

# Slice 2b (self-play training): torch/sb3 are optional, heavy, and not installed
# in the dev sandbox (see plans/phase-02-drl-selfplay.md, "Sandbox vs. local").
# `gamesim.rl.train` is the only module that touches them (imports are local/
# TYPE_CHECKING-guarded there -- see its module docstring), so this override just
# stops missing stubs/packages for these three from failing `make typecheck`
# without weakening strict mode anywhere else. gymnasium/pettingzoo are installed
# and fully typed (gymnasium ships py.typed; pettingzoo doesn't, hence the
# `type: ignore[import-untyped]` at its one import site) so they are NOT listed
# here on purpose.
[[tool.mypy.overrides]]
module = ["torch.*", "stable_baselines3.*", "sb3_contrib.*"]
ignore_missing_imports = true
