[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesim"
version = "0.0.1"
description = "A game-agnostic simulation and DRL framework for training and analyzing game-playing agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Josh Elliott" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# DRL stack — pulled in only when you start training (Phase 2).
rl = [
    "gymnasium>=0.29",
    "pettingzoo>=1.24",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",   # MaskablePPO (action masking)
    "torch>=2.2",
]
# Visualization — game-specific renderers (Phase 3).
viz = [
    "pygame>=2.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (e.g. training smoke tests)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
